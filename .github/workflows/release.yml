name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build/x64 -A x64 -DWOWCLIENT_OUTPUT_OVERRIDE=HoTClient64 -DWOWDECOMP_DISABLE_SIGNATURE_CHECKS=1 -DWOWCLIENT_FREEZE_DETECTOR=1 -DWOWCLIENT_CRASH_LOG=1

      - name: Build
        run: cmake --build build/x64 --config Release --target WowClient --parallel

      - name: Version
        id: version
        shell: pwsh
        run: |
          "tag=build-${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          "sha=$("${{ github.sha }}".Substring(0, 7))" >> $env:GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }} (${{ steps.version.outputs.sha }})
          generate_release_notes: true
          make_latest: true
          files: bin/Win/HoTClient64.exe
          fail_on_unmatched_files: true
